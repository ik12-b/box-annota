name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Gradle version must match gradle/wrapper/gradle-wrapper.properties
env:
  GRADLE_VERSION: "9.3.1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # packages is set explicitly to skip the legacy "tools" package,
      # which Google removed from the SDK repository years ago — the
      # action's default ("tools platform-tools") fails on modern runners.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install required SDK platform & build tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      # This AI Studio export doesn't ship gradlew / gradle-wrapper.jar,
      # so a system Gradle install is used to generate the wrapper first.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate Gradle wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version "$GRADLE_VERSION"
          fi
          chmod +x ./gradlew

      # debug.keystore is now committed to the repo (see .gitignore) rather
      # than regenerated per run, so every build — CI or local — signs with
      # the exact same debug key. This step is just a safety net for a fresh
      # checkout that's somehow missing the file; it should normally be a
      # no-op. Regenerating it on every run (the old behavior) meant every
      # CI-built APK had a different signature, which made Android refuse to
      # install a new build as an *update* over a previous one — only a full
      # uninstall-then-install worked.
      - name: Generate debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # google-services plugin is set to WARN (not fail) when this file is
      # missing, so no google-services.json is required to build.
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pdf-annotator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
